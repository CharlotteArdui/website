<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Charlotte Ardui</title>

  <meta
    name="description"
    content="Charlotte Ardui — architect, researcher and educator."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      overflow-x: hidden;
    }

    main {
      width: 100%;
    }

    #pdf-page {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
    }

    .loading,
    .error {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: #ffffff;
      color: #171717;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      line-height: 1.4;
    }

    .error {
      display: none;
    }

    .error a {
      color: inherit;
      text-decoration: underline;
    }

    @media print {
      .loading,
      .error {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <main>
    <canvas
      id="pdf-page"
      aria-label="Portfolio of Charlotte Ardui"
    ></canvas>
  </main>

  <div class="loading" id="loading">
    Loading…
  </div>

  <div class="error" id="error">
    <p>
      The portfolio could not be displayed.
      <a href="./WEB%20LAYOUT%20PC%20.pdf">
        Open the PDF.
      </a>
    </p>
  </div>

  <noscript>
    <p>
      <a href="./WEB%20LAYOUT%20PC%20.pdf">
        Open the portfolio.
      </a>
    </p>
  </noscript>

  <script type="module">
    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const PDF_FILE = encodeURI("./WEB LAYOUT PC .pdf");

    const canvas = document.getElementById("pdf-page");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    let pdf;
    let page;
    let renderTask;
    let resizeTimer;

    async function renderPage() {
      const originalViewport = page.getViewport({ scale: 1 });

      const availableWidth = document.documentElement.clientWidth;
      const scale = availableWidth / originalViewport.width;
      const viewport = page.getViewport({ scale });

      /*
       * A higher internal resolution keeps text and drawings sharp
       * on Retina screens, while the CSS dimensions remain unchanged.
       */
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(viewport.width * pixelRatio);
      canvas.height = Math.round(viewport.height * pixelRatio);

      canvas.style.width = `${viewport.width}px`;
      canvas.style.height = `${viewport.height}px`;

      const context = canvas.getContext("2d", {
        alpha: false
      });

      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, canvas.width, canvas.height);

      if (renderTask) {
        renderTask.cancel();
      }

      renderTask = page.render({
        canvasContext: context,
        viewport,
        transform: pixelRatio === 1
          ? null
          : [pixelRatio, 0, 0, pixelRatio, 0, 0]
      });

      try {
        await renderTask.promise;
        loading.style.display = "none";
      } catch (renderError) {
        if (renderError?.name !== "RenderingCancelledException") {
          throw renderError;
        }
      }
    }

    async function initialisePortfolio() {
      try {
        pdf = await pdfjsLib.getDocument(PDF_FILE).promise;
        page = await pdf.getPage(1);

        await renderPage();
      } catch (loadError) {
        console.error(loadError);

        loading.style.display = "none";
        error.style.display = "flex";
      }
    }

    window.addEventListener("resize", () => {
      if (!page) return;

      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(() => {
        renderPage().catch(console.error);
      }, 150);
    });

    initialisePortfolio();
  </script>

</body>
</html>
